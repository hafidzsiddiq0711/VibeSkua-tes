name: Skua Mobile

on:
  push:
    branches: [ skua-mobile ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # User-writable .NET so `dotnet workload install` needs no sudo.
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/../dotnet

jobs:
  headless:
    name: Skua headless on Linux (build + compiler selftest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Skua.Headless
        run: |
          set -o pipefail
          dotnet build Skua.Headless/Skua.Headless.csproj -c Release -o out/headless 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "error [A-Z]+[0-9]+|error :|: error" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done

      - name: Selftest (compile a script, then real CoreBots scripts from the repo)
        run: |
          set -o pipefail
          dotnet out/headless/skua-headless.dll selftest --with-scripts 2>&1 | tee selftest.log

      - name: Report selftest output as annotation
        if: failure()
        run: |
          python3 - <<'PY'
          lines = open("selftest.log", encoding="utf-8", errors="replace").read().splitlines()
          keep = [l for l in lines if any(k in l for k in ("Exception", "   at ", "FAIL", "OK", "error", "Unhandled"))]
          for chunk_start in range(0, min(len(keep), 120), 40):
              chunk = "\n".join(keep[chunk_start:chunk_start + 40]).replace("%", "%25").replace("\n", "%0A")
              print(f"::error title=selftest-{chunk_start}::{chunk}")
          tail = "\n".join(lines[-40:]).replace("%", "%25").replace("\n", "%0A")
          print(f"::error title=selftest-tail::{tail}")
          PY

  ruffle:
    name: Headless Ruffle (arm64 library + AQW end-to-end on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ruffle sources with Skua's patches
        run: |
          set -e
          REV=$(grep -o 'rev = "[0-9a-f]*"' Skua.Ruffle/Cargo.toml | head -1 | cut -d'"' -f2)
          git init -q ruffle-src
          git -C ruffle-src remote add origin https://github.com/ruffle-rs/ruffle.git
          git -C ruffle-src fetch -q --depth 1 origin "$REV"
          git -C ruffle-src checkout -q FETCH_HEAD
          for p in tools/ruffle-patches/*.patch; do git -C ruffle-src apply "../$p"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Skua.Ruffle

      - name: Build for Linux (end-to-end test)
        run: cargo build --release --manifest-path Skua.Ruffle/Cargo.toml --bin skua-ruffle

      - name: Build libskua_ruffle.so for Android arm64
        run: |
          set -e
          cargo install cargo-ndk --locked
          cd Skua.Ruffle
          cargo ndk --platform 26 -t arm64-v8a -o ../native build --release --lib
          ls -la ../native/arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: skua-ruffle-android
          path: native/arm64-v8a/libskua_ruffle.so

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: End-to-end - AQW loads in headless Ruffle, driven like Skua Mobile
        env:
          # Optional test account (repository secrets): also logs in and enters the world.
          SKUA_E2E_USER: ${{ secrets.SKUA_E2E_USER }}
          SKUA_E2E_PASS: ${{ secrets.SKUA_E2E_PASS }}
        run: |
          set -o pipefail
          dotnet build Skua.Headless/Skua.Headless.csproj -c Release -o out/headless
          dotnet out/headless/skua-headless.dll e2e --ruffle Skua.Ruffle/target/release/skua-ruffle \
            --swf tools/remote-poc/skua-mobile.swf --timeout 300 2>&1 | tee e2e.log

      - name: Report end-to-end output as annotation
        if: always()
        run: |
          python3 - <<'PY'
          lines = open("e2e.log", encoding="utf-8", errors="replace").read().splitlines() if __import__("os").path.exists("e2e.log") else []
          tail = "\n".join(lines[-45:]).replace("%", "%25").replace("\n", "%0A")
          print(f"::notice title=e2e::{tail}")
          PY

  windows-app:
    name: Desktop app still builds (RemoteFlashUtil moved to Skua.Core)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Skua.App.Avalonia/Skua.App.Avalonia.csproj -c Release

  android:
    name: Skua Mobile APK
    needs: ruffle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # publish the APK as a GitHub Release (direct download link)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Skua.Headless (its DLLs become the script compiler's references)
        run: dotnet build Skua.Headless/Skua.Headless.csproj -c Release -o out/headless

      - name: Pack app assets (refs.zip, skua-mobile.swf, default data)
        run: |
          set -e
          DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")
          REF=$(ls -d "$DOTNET_ROOT"/packs/Microsoft.NETCore.App.Ref/10.*/ref/net10.0 | sort -V | tail -1)
          echo "reference pack: $REF"
          mkdir -p refs Skua.Mobile/Assets
          cp "$REF"/*.dll refs/
          for f in out/headless/*.dll; do b=$(basename "$f"); [ -e "refs/$b" ] || cp "$f" refs/; done
          rm -f refs/skua-headless.dll
          (cd refs && zip -q -9 ../Skua.Mobile/Assets/refs.zip *.dll)
          ls -la Skua.Mobile/Assets/refs.zip
          cp tools/remote-poc/skua-mobile.swf Skua.Mobile/Assets/
          cp Skua.App.Avalonia/AdvancedSkills.json Skua.App.Avalonia/QuestData.json Skua.Mobile/Assets/

      - uses: actions/download-artifact@v4
        with:
          name: skua-ruffle-android
          path: Skua.Mobile/lib/arm64-v8a

      - name: Android SDK dependencies
        run: dotnet build Skua.Mobile/Skua.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=True -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Build APK
        run: |
          set -o pipefail
          dotnet build Skua.Mobile/Skua.Mobile.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" 2>&1 | tee android.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "error [A-Z]+[0-9]+|error :|: error" android.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=android::${line//%/%25}"
          done

      - name: Collect APK
        run: |
          mkdir -p apk
          find Skua.Mobile/bin/Release -name "*-Signed.apk" -exec cp {} apk/SkuaMobile.apk \;
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkuaMobile-apk
          path: apk/*.apk

      - name: Publish as release "skua-mobile-latest" (direct download link for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=skua-mobile-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" apk/SkuaMobile.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Skua Mobile (latest build)" \
            --notes "Automatic build of ${{ github.sha }}. Download SkuaMobile.apk and install it on the phone."
